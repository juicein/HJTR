<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>航线统计中心</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* =========================================================
   Material 3 Design
   ========================================================= */

:root {
  --md-primary: #0061a4;
  --md-on-primary: #ffffff;
  --md-primary-container: #d1e4ff;
  --md-on-primary-container: #001d36;

  --md-secondary: #535f70;
  --md-secondary-container: #d7e3f7;
  --md-on-secondary-container: #101c2b;

  --md-tertiary: #6b5778;
  --md-tertiary-container: #f2daff;

  --md-surface: #f9f9ff;
  --md-surface-container-low: #f3f3fa;
  --md-surface-container: #ededf4;
  --md-surface-container-high: #e7e8ee;

  --md-on-surface: #191c20;
  --md-on-surface-variant: #42474e;

  --md-outline: #73777f;
  --md-outline-variant: #c3c7cf;

  --md-error: #ba1a1a;
  --md-success: #286a30;

  --radius-small: 8px;
  --radius-medium: 16px;
  --radius-large: 24px;

  --shadow:
    0 1px 2px rgba(0,0,0,.05),
    0 2px 6px rgba(0,0,0,.04);
}

/* =========================================================
   Reset
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  background: var(--md-surface);
  color-scheme: light;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    "Noto Sans SC",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      var(--md-primary-container) 0,
      var(--md-surface) 260px
    );

  color: var(--md-on-surface);
  -webkit-font-smoothing: antialiased;
}

/* =========================================================
   Top App Bar
   ========================================================= */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  min-height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    max(12px, env(safe-area-inset-top))
    20px
    12px;

  background: rgba(249,249,255,.88);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid rgba(115,119,127,.15);

  color: var(--md-on-surface);

  font-size: 22px;
  font-weight: 650;
  letter-spacing: .1px;
}

/* =========================================================
   Main
   ========================================================= */

.container {
  width: min(1400px, 100%);
  margin: 0 auto;

  padding:
    20px
    max(20px, env(safe-area-inset-right))
    max(32px, calc(env(safe-area-inset-bottom) + 24px))
    max(20px, env(safe-area-inset-left));

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(min(100%, 420px), 1fr));

  gap: 16px;
}

/* =========================================================
   MD3 Card
   ========================================================= */

.card {
  position: relative;

  min-width: 0;

  background: var(--md-surface-container-low);

  border: 1px solid rgba(115,119,127,.13);

  border-radius: var(--radius-large);

  padding: 20px;

  box-shadow: var(--shadow);

  overflow: hidden;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.card:hover {
  transform: translateY(-1px);

  box-shadow:
    0 2px 4px rgba(0,0,0,.06),
    0 6px 14px rgba(0,0,0,.05);
}

/* =========================================================
   Card Header
   ========================================================= */

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 14px;
}

.card-title {
  margin: 0;

  font-size: 19px;
  line-height: 1.35;

  font-weight: 650;

  color: var(--md-on-surface);
}

.card-subtitle {
  margin-top: 4px;

  font-size: 13px;
  line-height: 1.4;

  color: var(--md-on-surface-variant);
}

/* =========================================================
   Chart Container
   ========================================================= */

/*
  重点：
  不再给 canvas 设置 height:260px !important

  而是给外层绘图区固定 aspect-ratio。
  Chart.js maintainAspectRatio:true 后不会拉伸。
*/

.chart-container {
  position: relative;

  width: 100%;

  height: 280px;

  min-height: 220px;

  margin: 4px 0 18px;
}

.chart-container canvas {
  display: block;

  width: 100% !important;
  height: 100% !important;
}

/* =========================================================
   Table
   ========================================================= */

.table-wrapper {
  width: 100%;

  overflow-x: auto;

  border-radius: 14px;

  background: var(--md-surface);
}

table {
  width: 100%;

  border-collapse: collapse;

  font-size: 14px;

  white-space: nowrap;
}

thead {
  background: var(--md-surface-container);
}

th {
  height: 42px;

  padding: 0 12px;

  text-align: left;

  font-size: 12px;

  font-weight: 600;

  color: var(--md-on-surface-variant);
}

td {
  height: 46px;

  padding: 0 12px;

  border-top: 1px solid var(--md-outline-variant);

  color: var(--md-on-surface);
}

tbody tr {
  transition: background .15s ease;
}

tbody tr:hover {
  background: var(--md-surface-container-low);
}

/* =========================================================
   Ranking
   ========================================================= */

.rank {
  width: 42px;

  text-align: center !important;

  font-weight: 700;
}

.rank-top {
  color: var(--md-primary);
}

/* =========================================================
   Score
   ========================================================= */

.score {
  font-weight: 700;
}

.score-high {
  color: var(--md-success);
}

.score-medium {
  color: #806000;
}

.score-low {
  color: var(--md-error);
}

/* =========================================================
   Chip
   ========================================================= */

.md-chip {
  display: inline-flex;

  align-items: center;

  min-height: 32px;

  padding: 0 12px;

  border-radius: 999px;

  background: var(--md-primary-container);

  color: var(--md-on-primary-container);

  font-size: 12px;

  font-weight: 600;

  white-space: nowrap;
}

/* =========================================================
   Empty State
   ========================================================= */

.empty {
  padding: 30px 10px;

  text-align: center;

  color: var(--md-on-surface-variant);

  font-size: 14px;
}

/* =========================================================
   Mobile
   ========================================================= */

@media (max-width: 700px) {

  header {
    min-height: 56px;

    font-size: 20px;
  }

  .container {
    grid-template-columns: 1fr;

    padding:
      14px
      14px
      28px;
  }

  .card {
    padding: 16px;

    border-radius: 22px;
  }

  .card-title {
    font-size: 17px;
  }

  .chart-container {
    height: 240px;
  }

  table {
    font-size: 13px;
  }

  th {
    height: 38px;

    padding: 0 10px;
  }

  td {
    height: 44px;

    padding: 0 10px;
  }
}

/* =========================================================
   Small Phone
   ========================================================= */

@media (max-width: 400px) {

  .container {
    padding-left: 10px;
    padding-right: 10px;
  }

  .card {
    padding: 14px;

    border-radius: 20px;
  }

  .chart-container {
    height: 210px;
  }

  .card-title {
    font-size: 16px;
  }

  table {
    font-size: 12px;
  }
}

/* =========================================================
   Reduced Motion
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  航线统计中心
</header>

<main class="container">

  <!-- =====================================================
       Airport
       ===================================================== -->

  <section class="card">

    <div class="card-header">
      <div>
        <h2 class="card-title">机场航线数量排行榜</h2>
        <div class="card-subtitle">
          根据航班数据统计机场参与的航线数量
        </div>
      </div>

      <span class="md-chip">Airport</span>
    </div>

    <div class="chart-container">
      <canvas id="airportChart"></canvas>
    </div>

    <div class="table-wrapper">
      <table id="airportTable"></table>
    </div>

  </section>


  <!-- =====================================================
       Airline
       ===================================================== -->

  <section class="card">

    <div class="card-header">
      <div>
        <h2 class="card-title">航空公司开行数量</h2>
        <div class="card-subtitle">
          各航空公司当前航班数量排名
        </div>
      </div>

      <span class="md-chip">Airline</span>
    </div>

    <div class="chart-container">
      <canvas id="airlineChart"></canvas>
    </div>

    <div class="table-wrapper">
      <table id="airlineTable"></table>
    </div>

  </section>


  <!-- =====================================================
       Hub
       ===================================================== -->

  <section class="card">

    <div class="card-header">
      <div>
        <h2 class="card-title">机场枢纽指数</h2>
        <div class="card-subtitle">
          根据航线数量与机场等级计算综合得分
        </div>
      </div>

      <span class="md-chip">Hub</span>
    </div>

    <div class="table-wrapper">
      <table id="hubTable"></table>
    </div>

  </section>


  <!-- =====================================================
       Sustainability
       ===================================================== -->

  <section class="card">

    <div class="card-header">
      <div>
        <h2 class="card-title">运营可持续指数</h2>
        <div class="card-subtitle">
          根据航空公司开行规模计算运营指数
        </div>
      </div>

      <span class="md-chip">Sustainability</span>
    </div>

    <div class="chart-container">
      <canvas id="sustainChart"></canvas>
    </div>

    <div class="table-wrapper">
      <table id="sustainTable"></table>
    </div>

  </section>

</main>


<script>

/* =========================================================
   手动加分
   ========================================================= */

const HUB_BONUS = {
  "BKE": 0,
  "KLM": 10,
  "AHF": 0
};


/* =========================================================
   Chart.js 全局设置
   ========================================================= */

Chart.defaults.font.family =
  '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans SC", sans-serif';

Chart.defaults.font.size = 12;

Chart.defaults.color = "#42474e";

Chart.defaults.animation.duration = 500;


/* =========================================================
   加载数据
   ========================================================= */

Promise.all([
  fetch("./data/airports.json").then(r => {
    if (!r.ok) throw new Error("airports.json 加载失败");
    return r.json();
  }),

  fetch("./data/flight_data.txt").then(r => {
    if (!r.ok) throw new Error("flight_data.txt 加载失败");
    return r.text();
  })

])
.then(init)
.catch(error => {
  console.error(error);

  document.querySelectorAll("table").forEach(table => {
    table.innerHTML =
      `<tr>
        <td class="empty">
          数据加载失败
        </td>
      </tr>`;
  });
});


/* =========================================================
   初始化
   ========================================================= */

function init([airports, flightRaw]) {

  const airportMap = {};

  airports.forEach(a => {

    airportMap[a.name] = {
      ...a,
      flights: 0,
      hubScore: 0
    };

  });


  const airlineCount = {};
  const airportCount = {};


  /* =======================================================
     航班解析
     ======================================================= */

  for (const seg of flightRaw.split("《航班结束》")) {

    if (!seg.includes("【")) continue;


    const airline =
      seg.match(/『(.*?)』/)?.[1] ??
      "未知航空";


    const from =
      seg.match(/《(.*?)出发》/)?.[1];


    const to =
      seg.match(/@《(.*?)到达》/)?.[1];


    if (!from || !to) continue;


    airlineCount[airline] =
      (airlineCount[airline] || 0) + 1;


    [from, to].forEach(p => {

      airportCount[p] =
        (airportCount[p] || 0) + 1;


      if (airportMap[p]) {
        airportMap[p].flights++;
      }

    });

  }


  /* =======================================================
     枢纽指数
     ======================================================= */

  for (const a of Object.values(airportMap)) {

    const level =
      String(a.level || "");

    const weight =
      level.startsWith("4")
        ? 1.25
        : 1.0;


    const bonus =
      HUB_BONUS[a.code] || 0;


    a.hubScore =
      Math.round(
        a.flights * weight + bonus
      );

  }


  /* =======================================================
     可持续指数
     ======================================================= */

  const sustain = {};


  for (const k in airlineCount) {

    const f = airlineCount[k];

    let colorClass = "score-high";


    if (f < 2) {
      colorClass = "score-low";
    }

    else if (f < 4) {
      colorClass = "score-medium";
    }


    sustain[k] = {
      score: f,
      colorClass
    };

  }


  /* =======================================================
     图表
     ======================================================= */

  renderBar(
    "airportChart",
    airportCount,
    "航线数"
  );


  renderBar(
    "airlineChart",
    airlineCount,
    "航班数"
  );


  renderPie(
    "sustainChart",
    airlineCount
  );


  /* =======================================================
     表格
     ======================================================= */

  fillRank(
    "#airportTable",
    airportCount,
    "机场"
  );


  fillRank(
    "#airlineTable",
    airlineCount,
    "航空公司"
  );


  fillHub(
    "#hubTable",
    airportMap
  );


  fillSustain(
    "#sustainTable",
    sustain
  );

}


/* =========================================================
   MD3 Chart 配置
   ========================================================= */

function baseChartOptions() {

  return {

    responsive: true,

    maintainAspectRatio: false,

    animation: {
      duration: 450
    },

    plugins: {

      legend: {
        display: false
      },

      tooltip: {
        backgroundColor: "#191c20",

        titleColor: "#ffffff",

        bodyColor: "#ffffff",

        padding: 12,

        cornerRadius: 12,

        displayColors: false
      }

    },

    scales: {

      x: {

        grid: {
          display: false
        },

        border: {
          display: false
        },

        ticks: {
          color: "#42474e",

          maxRotation: 45,

          minRotation: 0,

          autoSkip: true,

          maxTicksLimit: 10
        }

      },

      y: {

        beginAtZero: true,

        grid: {
          color: "rgba(115,119,127,.15)"
        },

        border: {
          display: false
        },

        ticks: {
          precision: 0,

          color: "#42474e"
        }

      }

    }

  };

}


/* =========================================================
   Bar Chart
   ========================================================= */

function renderBar(id, obj, label) {

  const options = baseChartOptions();


  new Chart(
    document.getElementById(id),
    {

      type: "bar",

      data: {

        labels: Object.keys(obj),

        datasets: [

          {
            label,

            data: Object.values(obj),

            borderWidth: 0,

            borderRadius: 7,

            borderSkipped: false,

            maxBarThickness: 42,

            backgroundColor:
              "#0061a4"
          }

        ]

      },

      options

    }
  );

}


/* =========================================================
   Pie Chart
   ========================================================= */

function renderPie(id, obj) {

  new Chart(
    document.getElementById(id),
    {

      type: "doughnut",

      data: {

        labels: Object.keys(obj),

        datasets: [

          {

            data: Object.values(obj),

            borderWidth: 3,

            borderColor: "#ededf4",

            hoverOffset: 5

          }

        ]

      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        cutout: "58%",

        plugins: {

          legend: {

            position: "bottom",

            labels: {

              usePointStyle: true,

              pointStyle: "circle",

              padding: 16,

              boxWidth: 8

            }

          },

          tooltip: {

            backgroundColor: "#191c20",

            padding: 12,

            cornerRadius: 12

          }

        }

      }

    }
  );

}


/* =========================================================
   排行表
   ========================================================= */

function fillRank(sel, obj, nameTitle) {

  const sorted =
    Object.entries(obj)
      .sort((a,b) => b[1] - a[1]);


  if (!sorted.length) {

    document.querySelector(sel).innerHTML =
      `<tr>
        <td class="empty">
          暂无数据
        </td>
      </tr>`;

    return;
  }


  let html = `
    <thead>
      <tr>
        <th>#</th>
        <th>${nameTitle}</th>
        <th>数量</th>
      </tr>
    </thead>
    <tbody>
  `;


  sorted.forEach(([k,v],i) => {

    html += `
      <tr>

        <td class="rank ${
          i < 3 ? "rank-top" : ""
        }">
          ${i + 1}
        </td>

        <td>${escapeHTML(k)}</td>

        <td>
          <strong>${v}</strong>
        </td>

      </tr>
    `;

  });


  html += "</tbody>";


  document.querySelector(sel).innerHTML = html;

}


/* =========================================================
   Hub Table
   ========================================================= */

function fillHub(sel, map) {

  const arr =
    Object.values(map)
      .sort(
        (a,b) =>
          b.hubScore - a.hubScore
      );


  if (!arr.length) {

    document.querySelector(sel).innerHTML =
      `<tr>
        <td class="empty">
          暂无数据
        </td>
      </tr>`;

    return;
  }


  let html = `
    <thead>
      <tr>
        <th>#</th>
        <th>机场</th>
        <th>代码</th>
        <th>航线</th>
        <th>得分</th>
      </tr>
    </thead>
    <tbody>
  `;


  arr.forEach((a,i) => {

    html += `
      <tr>

        <td class="rank ${
          i < 3 ? "rank-top" : ""
        }">
          ${i + 1}
        </td>

        <td>
          ${escapeHTML(a.name)}
        </td>

        <td>
          <span class="md-chip">
            ${escapeHTML(a.code)}
          </span>
        </td>

        <td>
          ${a.flights}
        </td>

        <td class="score">
          ${a.hubScore}
        </td>

      </tr>
    `;

  });


  html += "</tbody>";


  document.querySelector(sel).innerHTML = html;

}


/* =========================================================
   Sustainability
   ========================================================= */

function fillSustain(sel, obj) {

  const arr =
    Object.entries(obj)
      .sort(
        (a,b) =>
          b[1].score -
          a[1].score
      );


  if (!arr.length) {

    document.querySelector(sel).innerHTML =
      `<tr>
        <td class="empty">
          暂无数据
        </td>
      </tr>`;

    return;
  }


  let html = `
    <thead>
      <tr>
        <th>#</th>
        <th>航空公司</th>
        <th>指数</th>
      </tr>
    </thead>
    <tbody>
  `;


  arr.forEach(([k,v],i) => {

    html += `
      <tr>

        <td class="rank ${
          i < 3 ? "rank-top" : ""
        }">
          ${i + 1}
        </td>

        <td>
          ${escapeHTML(k)}
        </td>

        <td class="score ${v.colorClass}">
          ${v.score}
        </td>

      </tr>
    `;

  });


  html += "</tbody>";


  document.querySelector(sel).innerHTML = html;

}


/* =========================================================
   HTML 安全转义
   ========================================================= */

function escapeHTML(str) {

  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
